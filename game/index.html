<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#101d36">
<title>Раян и Дия · Звёздный забег</title><meta name="description" content="Прыгай, собирай звёзды и тренируй кудо вместе с Раяном и Дией."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='16' y='26' text-anchor='middle' font-size='28'%3E⭐%3C/text%3E%3C/svg%3E"><link rel="stylesheet" href="style.css">
</head>
<body><a href="/" aria-label="Вернуться на сайт проекта" style="display:inline-block;margin:12px 16px;color:#fff;font:600 14px system-ui,sans-serif;text-decoration:none">← На сайт проекта</a><main class="game" aria-label="Раян и Дия: звёздный забег">
<header class="top"><h1><b id="heroName">Раян</b><span>ЗВЁЗДНЫЙ ЗАБЕГ</span></h1><button id="pause" class="small" disabled>Пауза</button></header>
<section class="stats" aria-label="Результат забега"><div><span>★ Звёзды</span><strong id="stars">0</strong></div><div><span>Время</span><strong id="time">60 с</strong></div><div><span>♥ Жизни</span><strong id="health">3</strong></div></section>
<section class="arena" aria-label="Игровое поле"><div class="progress"><div id="progress"></div></div><canvas id="scene" aria-label="Раян бежит по дорожке. Перепрыгивай красные преграды и разбивай золотые мишени."></canvas><div class="stage-label">ДОРОГА К ЗВЁЗДАМ</div>
<div class="overlay" id="overlay"><div class="card"><span class="eyebrow" id="eyebrow">60 секунд приключения</span><h2 id="title">Выбери героя</h2><div id="characterPicker" class="character-picker" role="group" aria-label="Выбери героя"><button id="choose-rayan" class="character-choice" aria-pressed="true" disabled><canvas id="avatar-rayan" class="avatar" aria-hidden="true"></canvas><strong>Раян</strong><span class="selected-mark" aria-hidden="true">✓</span></button><button id="choose-dia" class="character-choice" aria-pressed="false" disabled><canvas id="avatar-dia" class="avatar" aria-hidden="true"></canvas><strong>Дия</strong><span class="selected-mark" aria-hidden="true">✓</span></button></div><p id="message">Прыгай. Разбивай мишени.<br>Собирай звёзды!</p><p class="asset-note" id="assetNote" role="status">Загрузка…</p><button id="start" class="primary" disabled>Побежали!</button></div></div><aside id="coachBubble" class="coach-bubble" aria-label="Подсказка тренера Аделя" hidden><strong>Тренер Адель</strong><span>Давайте, скорее вперёд!</span></aside><output id="feedback" class="feedback" aria-live="polite"></output></section>
<section class="controls" aria-label="Управление"><button id="jump" class="action jump" disabled><span class="symbol">↑</span><strong>Прыжок</strong><span class="key">Пробел / ↑</span></button><button id="strike" class="action strike" disabled><span class="symbol">✦</span><strong>Кудо</strong><span class="key">K / Enter</span><i id="cooldown"></i></button></section>
<p class="hint">Три жизни. Один забег. Сколько звёзд соберёшь?</p><p class="draft" id="draft" hidden></p>
</main><script type="module" src="ui.js"></script></body></html>
